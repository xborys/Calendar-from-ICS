<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>NAME</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/skeleton.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/classic/theme.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/classic/palette.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/all/global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/classic/global.js"></script>
  <style>
    body { margin: 40px; font-family: Arial, sans-serif; }
    #calendar { max-width: 900px; margin: auto; }
  </style>
</head>
<body>

  <div class="header-container">
    <h2>NAME</h2>
  </div>

  <div id="calendar"></div>

  <script type="module">
    // ical.js 2.x is published only as an ES module.
    import ICAL from 'https://cdn.jsdelivr.net/npm/ical.js@2.2.1/dist/ical.min.js';

    // Expands the VEVENTs of a parsed calendar into FullCalendar events within [rangeStart, rangeEnd).
    // ical.js handles RRULE (incl. BYDAY/COUNT), EXDATE, RECURRENCE-ID and time zones.
    function expandEvents(comp, rangeStart, rangeEnd) {
      comp.getAllSubcomponents('vtimezone').forEach(tz => ICAL.TimezoneService.register(tz));

      const masters = [];
      const mastersByUid = new Map();
      const exceptions = [];

      comp.getAllSubcomponents('vevent').forEach(vevent => {
        const e = new ICAL.Event(vevent);
        if (e.isRecurrenceException()) {
          exceptions.push(e);
        } else {
          masters.push(e);
          if (e.uid) mastersByUid.set(e.uid, e);
        }
      });

      // Moved occurrences replace the original instance of their series.
      let iterateUntil = rangeEnd;
      exceptions.forEach(ex => {
        const master = mastersByUid.get(ex.uid);
        if (master && master.isRecurring()) {
          master.relateException(ex);
          const recurrenceId = ex.recurrenceId.toJSDate();
          if (recurrenceId > iterateUntil) iterateUntil = recurrenceId;
        } else {
          masters.push(ex);
        }
      });

      const result = [];

      function addOccurrence(item, startDate, endDate, recurring) {
        const status = item.component.getFirstPropertyValue('status');
        if (status && status.toUpperCase() === 'CANCELLED') return;

        const start = startDate.toJSDate();
        const end = endDate.toJSDate();
        if (start >= rangeEnd || end < rangeStart) return;

        // All-day dates stay as plain YYYY-MM-DD so they don't shift through UTC.
        const allDay = startDate.isDate;
        result.push({
          title: item.summary + (recurring ? ' (Recurring)' : ''),
          start: allDay ? startDate.toString() : start,
          end: allDay ? endDate.toString() : end,
          allDay: allDay,
          description: item.description,
          location: item.location,
        });
      }

      masters.forEach(e => {
        if (!e.isRecurring()) {
          addOccurrence(e, e.startDate, e.endDate, false);
          return;
        }

        const iterator = e.iterator();
        let next;
        while ((next = iterator.next())) {
          if (next.toJSDate() >= iterateUntil) break;
          const details = e.getOccurrenceDetails(next);
          addOccurrence(details.item, details.startDate, details.endDate, true);
        }
      });

      return result;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const icsUrl = '/calendar-proxy/calendar.ics';
      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        nowIndicator: true,
        slotDuration: '00:30:00',
        height: 'auto',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'timeGridDay,timeGridWeek'
        },
        allDaySlot: false,
        slotMinTime: "07:00:00",
        slotMaxTime: "17:00:00",
        businessHours: {
          startTime: '07:00',
          endTime: '17:00',
          daysOfWeek: [1, 2, 3, 4, 5]
        },
        // v7 defaults to a month-only title ("Oct 2026") for week views.
        titleFormat: { year: 'numeric', month: 'short', day: 'numeric' },
        slotHeaderFormat: {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        },
        firstDay: 1,
        hiddenDays: [0, 6],
        events: loadICS,
        eventTimeFormat: {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }
      });

      calendar.render();

      function loadICS(info, successCallback, failureCallback) {
        const timestamp = new Date().getTime();
        fetch(`${icsUrl}?t=${timestamp}`)
          .then(response => response.text())
          .then(data => {
            const comp = new ICAL.Component(ICAL.parse(data));
            successCallback(expandEvents(comp, info.start, info.end));
          })
          .catch(err => {
            console.error('Error loading .ics file:', err);
            alert(`Failed to load the calendar. Details: ${err.message}`);
            failureCallback(err);
          });
      }

      setInterval(() => calendar.refetchEvents(), 60000);
    });
  </script>

</body>
</html>
